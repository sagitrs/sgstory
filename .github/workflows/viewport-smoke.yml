name: viewport-smoke

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: pip install fonttools brotli
      - run: npm run build
      - run: npm i --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node scripts/viewport-smoke.mjs
      - if: failure() || success()
        uses: actions/upload-artifact@v4
        with:
          name: viewport-baseline
          path: test/viewport-baseline.json
          if-no-files-found: ignore
