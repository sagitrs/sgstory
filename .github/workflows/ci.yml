name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: pip install fonttools brotli  # 字体子集化（霞鹜文楷）
      - run: git fetch origin main --depth=1  # 门2（新段落必配测）需要 origin/main 基线（#208B 前它在 CI 恒跳过）
      - run: npm test

  soak:
    # L2 对抗席游走器长测（#382 缩量）：10+10 局随机游走 + 位点双支清扫（双支为确定性定向扫描，与局数无关）
    # 全量兜底 = soak-nightly.yml（30 30 + 多种子矩阵，更强覆盖）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: pip install fonttools brotli
      - run: npm run build
      - run: node test/walker.mjs 10 10
      # #385：真机浏览器断言入 PR 门（原步骤恒 skipped——绿灯含义失真，#363 静默降级族）
      - run: npm i --no-save playwright
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-chromium-${{ runner.os }}-v1
      - run: npx playwright install --with-deps chromium
      - name: browser.mjs real-browser assertions
        env:
          CI_REQUIRE_BROWSER: "1"
          CHROME_PATH: ${{ github.workspace }}/pw-chromium-ci
        run: |
          PW_PATH=$(node -e "console.log(require('playwright').chromium.executablePath())")
          test -x "$PW_PATH" || { echo "ERROR: playwright chromium 缺失"; exit 1; }
          ln -sf "$PW_PATH" "$CHROME_PATH"
          node test/browser.mjs

  deploy:
    # main 分支推送且测试通过后，自动发布到 GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [test, soak]
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: pip install fonttools brotli
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4

  post-deploy-smoke:
    # 线上冒烟（#188）：部署后拉线上产物，断言可达/字体外链/preload/体积预算
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [deploy]
    runs-on: ubuntu-latest
    steps:
      - name: smoke
        run: |
          set -e
          URL="${{ needs.deploy.outputs.page_url }}"
          OK=""
          for i in 1 2 3 4 5; do
            if curl -sfL "$URL" -o /tmp/idx.html; then OK=1; break; fi
            echo "第 $i 次未就绪（CDN 传播），15s 后重试…"; sleep 15
          done
          test -n "$OK" || { echo "✗ 线上页面不可达：$URL"; exit 1; }
          grep -q 'id="font-face"' /tmp/idx.html || { echo "✗ 缺 @font-face 注入"; exit 1; }
          test "$(grep -c 'rel="preload"' /tmp/idx.html)" -ge 2 || { echo "✗ 字体 preload 不足 2"; exit 1; }
          SZ=$(wc -c < /tmp/idx.html)
          test "$SZ" -lt 1000000 || { echo "✗ index.html ${SZ}B ≥ 1MB（疑似回胖/内嵌字体）"; exit 1; }
          curl -sfL -o /dev/null "${URL}fonts/LXGWWenKai-Regular.woff2" || { echo "✗ 字体 404（mis-deploy）"; exit 1; }
          curl -sfL -o /dev/null "${URL}fonts/LXGWWenKai-Medium.woff2" || { echo "✗ 字体 404（mis-deploy）"; exit 1; }
          echo "✔ 线上冒烟通过：index ${SZ}B + 字体外链可达 + preload ×2"
