name: viewport-smoke

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: pip install fonttools brotli
      - run: npm run build
      - run: npm i --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node scripts/viewport-smoke.mjs
      # #284 ②：真机验收 24 断言接线（方案㈡：复用本 job 已装 chromium）
      - name: browser.mjs real-browser acceptance (24 assertions)
        env:
          CHROME_PATH: ${{ github.workspace }}/pw-chromium-tmp
        run: |
          # playwright chromium 可执行路径注入（脚本默认扫 puppeteer 缓存——CI 面不适用）
          PW_PATH=$(node -e "console.log(require('playwright').chromium.executablePath())")
          test -x "$PW_PATH" || { echo "ERROR: playwright chromium 缺失"; exit 1; }
          ln -sf "$PW_PATH" "$CHROME_PATH"
          OUT=$(node test/browser.mjs 2>&1 | tee /dev/stderr)
          # 三态守卫（#284①③ 合入后脚本形态：正常=BROWSER_ASSERTIONS N/M 锚点行 / skipped / 失败非零退）
          echo "$OUT" | grep -q 'BROWSER_ASSERTIONS skipped' && { echo "ERROR: browser.mjs 跳过——CI 接线失效"; exit 1; }
          N=$(echo "$OUT" | sed -nE 's/^BROWSER_ASSERTIONS ([0-9]+)\/([0-9]+)$/\1/p')
          test -n "$N" && test "$N" -ge 24 || { echo "ERROR: 断言计数未达下界（N=$N）"; exit 1; }
          echo "$OUT" | grep -q '真实浏览器验收：全部通过' || { echo "ERROR: 未见成功行"; exit 1; }
      - if: failure() || success()
        uses: actions/upload-artifact@v4
        with:
          name: viewport-baseline
          path: test/viewport-baseline.json
          if-no-files-found: ignore
