name: soak-nightly

on:
  schedule:
    - cron: '0 20 * * *'  # UTC 20:00 = 北京 04:00
  workflow_dispatch:

permissions:
  contents: read
  issues: write   # `#630`：夜间游走是**仪器**（report-only）——失败要留痕（开票去重），但不阻塞任何合入

jobs:
  soak:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        seed: [1, 7, 42]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: pip install fonttools brotli
      - run: node build.mjs
      # 随机游走的家（report-only）：多种子长测；**失败不阻塞合入**，而是开票留痕（见下一步）
      - run: node test/walker.mjs 30 30 ${{ matrix.seed }}
      # 缺口趋势的可见性（`#628`，**report-only、不入任何门禁**）：抽样观测，未观测 ≠ 断言不存在
      - if: always()
        run: npm run report:polarity
      - name: 失败 ⇒ 开票留痕（同一形态不重复开票）
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          open=$(gh issue list --repo "${{ github.repository }}" --state open --search '"[soak-nightly]" in:title' --json number --jq 'length')
          if [ "$open" != "0" ]; then echo "已有未关闭的 [soak-nightly] 票（$open 张）⇒ 不重复开"; exit 0; fi
          gh issue create --repo "${{ github.repository }}" --label bug \
            --title "[soak-nightly] 随机游走发现异常（seed ${{ matrix.seed }}）" \
            --body "夜间随机游走（seed \`${{ matrix.seed }}\`）失败：[run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

          依伞 #626 的规则：随机游走是**仪器**（report-only），**每个发现必须沉淀**为「矩阵一行」或「覆盖原子一条路线」——否则不开修复票。" 
      - if: failure() || success()
        uses: actions/upload-artifact@v4
        with:
          name: walker-log-seed-${{ matrix.seed }}
          path: |
            build/coverage-walker.json
            build/polarity-gap.md
          if-no-files-found: ignore
