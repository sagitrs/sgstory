name: test
on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 构建（生成单测 bundle 与清单）
        run: python3 build.py
      - name: 无头单测（断言 fail === 0）
        run: node tests/unit/headless.mjs
