name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read   # #520：`changes` job 用 `gh api .../pulls/N/files` 读改动面

jobs:
  changes:
    # #520（CI 时长）：**只改文档就别跑真机/确定性面**。
    # 判据：**所有**改动文件都落在「文档面」（`docs/**` 或任意 `*.md`）⇒ `code=false`（跳 `realmachine`）；否则照跑。
    # 为什么单开一个 job（而不是在 `realmachine` 里早退）：跳过的理由要**可见可审**——`realmachine: skipped` ＋ 本 job 的
    # 输出（改了哪些文件、判成什么）都留在 run 页上，符合本仓「不许静默降级」的纪律。
    # 失败开向：算不出改动面 ⇒ `code=true`（照跑），**不静默少跑**。
    # push（main）恒 `code=true`：`deploy` 依赖它，main 上这一段不该省。
    # 成本：无 checkout，一次 API 调用（≈3-5s）；与 test 并行，只可能让 `realmachine` 晚几秒起跑。
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.judge.outputs.code }}
    steps:
      - id: judge
        name: 改动面判定（文档面 ⇒ code=false）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          code=true
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FILES=$(gh api --paginate "repos/${{ github.repository }}/pulls/${{ github.event.number }}/files" --jq '.[].filename' || true)
            if [ -n "$FILES" ] && ! printf '%s\n' "$FILES" | grep -qvE '^(docs/|.*\.md$)'; then
              code=false
            fi
            echo "改动文件（前 20）：$(printf '%s\n' "$FILES" | head -20 | tr '\n' ' ')"
          else
            echo "push 事件：恒定 code=true（deploy 链路不省这一段）"
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = "false" ]; then
            echo "⇒ 纯文档改动，**跳过 realmachine**（位点双支清扫 ＋ 真机浏览器）：它们对文档零价值"
          fi

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: pip install fonttools brotli  # 字体子集化（霞鹜文楷）
      - run: git fetch origin main --depth=1  # 门2（新段落必配测）需要 origin/main 基线（#208B 前它在 CI 恒跳过）
      # #562：**F6 台账新鲜度门**要查 issue 状态（`| #247 待办 |` 这类标记的实况）⇒ CI 必须给 token，
      # 否则它「○ 跳过（无 token）」并**退 0** —— 那是「门在 CI 里从未真正跑过」的真空洞（与 `#557` 的假绿同类）。
      - run: npm test
        env:
          GH_TOKEN: ${{ github.token }}
      # #520：把产物交给 deploy 复用（main push 才传）——deploy 原先自己 checkout＋npm ci＋build（≈20s），
      # 而这两个 job 刚刚都构过同样的 dist。
      - if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1

  realmachine:
    # `#630`／伞 `#626`：**名字与内容对齐**——这里装的是**确定性**断言（位点双支清扫）＋**真机**浏览器断言，
    # 不再是随机长测（那个已搬进 `soak-nightly.yml`，report-only）。旧名 `soak` 会让人以为门禁里还跑抽样。
    # **确定性部分＋真机**（`#630`／伞 `#626`）：位点**双支清扫**（定向扫描，与局数无关，实测 68 位点 ≈3s）＋ 真机浏览器断言。
    # 随机游走**已从 PR 门撤出**——它是**仪器**不是**判据**：断言的是"抽样路径上没崩"，不是"行为符合预期"；
    # 把它设成门＝用抽样运气冒充规格（这正是伞 `#626` 要改的形态）。长测改由 `soak-nightly.yml` 跑（report-only）。
    # 覆盖口径早就不吃它：`test/coverage.mjs:24`＝`#27` 的降级决定。
    # #520：**纯文档改动跳过本 job**（`changes` job 判；理由与失败开向见那里）
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: pip install fonttools brotli
      - run: npm run build
      # 0 0 ＝ 只跑**确定性**的位点双支清扫（不再抽样）；随机游走的多种子矩阵见 nightly
      - run: node test/walker.mjs 0 0
      # #385：真机浏览器断言入 PR 门（原步骤恒 skipped——绿灯含义失真，#363 静默降级族）
      - run: npm i --no-save playwright
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-chromium-${{ runner.os }}-v1
      - run: npx playwright install --with-deps chromium
      - name: browser.mjs real-browser assertions
        env:
          CI_REQUIRE_BROWSER: "1"
          CHROME_PATH: ${{ github.workspace }}/pw-chromium-ci
        run: |
          PW_PATH=$(node -e "console.log(require('playwright').chromium.executablePath())")
          test -x "$PW_PATH" || { echo "ERROR: playwright chromium 缺失"; exit 1; }
          ln -sf "$PW_PATH" "$CHROME_PATH"
          node test/browser.mjs

  deploy:
    # main 分支推送且测试通过后，自动发布到 GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [test, realmachine]
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    timeout-minutes: 15
    steps:
      # #520：不再自己 checkout＋npm ci＋build（≈20s）——直接复用 test job 已在同一 commit 上构建好的 dist。
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4

  post-deploy-smoke:
    # 线上冒烟（#188）：部署后拉线上产物，断言可达/字体外链/preload/体积预算
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: smoke
        run: |
          set -e
          URL="${{ needs.deploy.outputs.page_url }}"
          OK=""
          for i in 1 2 3 4 5; do
            if curl -sfL "$URL" -o /tmp/idx.html; then OK=1; break; fi
            echo "第 $i 次未就绪（CDN 传播），15s 后重试…"; sleep 15
          done
          test -n "$OK" || { echo "✗ 线上页面不可达：$URL"; exit 1; }
          # β2 多故事（#441）：书架页=可达+体积界；字体三断言随语义迁故事页（CIE 裁 A）
          SZ=$(wc -c < /tmp/idx.html)
          test "$SZ" -gt 0 -a "$SZ" -lt 100000 || { echo "✗ 书架页 ${SZ}B 越界（应 >0 且 <1e5，防内嵌资产回潮）"; exit 1; }
          grep -q 'stories/' /tmp/idx.html || { echo "✗ 书架页无故事链接"; exit 1; }
          STORY="${URL}stories/mist-forest/index.html"
          curl -sfL "$STORY" -o /tmp/story.html || { echo "✗ 默认故事页不可达：$STORY"; exit 1; }
          grep -q 'id="font-face"' /tmp/story.html || { echo "✗ 故事页缺 @font-face 注入"; exit 1; }
          test "$(grep -c 'rel="preload"' /tmp/story.html)" -ge 2 || { echo "✗ 故事页字体 preload 不足 2"; exit 1; }
          SSZ=$(wc -c < /tmp/story.html)
          # 上界与 `scripts/dist-paths.mjs` 的 STORY_PAGE_MAX_BYTES／SHELF_PAGE_MAX_BYTES 同口径（由 test/multi-story.mjs 的 P5 门钉住，别只改这里）
          test "$SSZ" -lt 1000000 || { echo "✗ 故事页 ${SSZ}B ≥ 1MB（疑似回胖/内嵌字体）"; exit 1; }
          curl -sfL -o /dev/null "${URL}fonts/LXGWWenKai-Regular.woff2" || { echo "✗ 字体 404（mis-deploy）"; exit 1; }
          curl -sfL -o /dev/null "${URL}fonts/LXGWWenKai-Medium.woff2" || { echo "✗ 字体 404（mis-deploy）"; exit 1; }
          echo "✔ 线上冒烟通过：书架 ${SZ}B（含故事链接）+ 故事页 ${SSZ}B 字体三断言 + 字体外链可达"
