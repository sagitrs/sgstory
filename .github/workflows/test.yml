name: test
on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      # ★`#1832`：**整档翻转**判据须有 base 可比 ⇒ 检出**完整历史**（默认 `fetch-depth: 1` 下
      #   `origin/main` 不存在 ⇒ 判据**取不到 base** ⇒ 只能静默退化为「只判混行」＝本票要消灭的形态）。
      #   实测本仓 **165 提交／工作树 240 文件** ⇒ 全history 代价可受（✗ 用 `git fetch <sha>` ——
      #   那依赖服务端允许按 sha 取，脆弱）。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 门的摆位（#1714 权衡）：**同 job 内、构建之前的独立 step**，不另开 job——
      #   ①本门不依赖 build 产物（纯静态读仓 + 离线缓存）⇒ 前置即 fail-fast；
      #   ②本仓 CI 只有一个 job，为 <1s 的静态门另开 job 要多付一次排队/checkout；
      #   ③独立 step 使红面归因清晰（step 级红/绿），且可与单测分步重跑。
      - name: 引用形与 pin 完整性门（#1714 第①级；离线，缓存缺失即红）
        run: node tests/gates/refs-integrity.mjs
      - name: ★直构棘轮（`#1750` ② · 新用例不得再绕注册面）
        run: node tests/gates/shim-ratchet.mjs
      - name: ★直构棘轮 · 自证（会红也会绿）
        run: node tests/gates/shim-ratchet.mjs --selftest
      - name: 门自身的可假刀自检（刀数见输出；证明门会红也会绿）
        run: node tests/gates/refs-integrity.selftest.mjs
      - name: ★步骤键形门（每步须有 run/uses；块内 run 不重复 · `#1994` 教训机械化）
        run: node tests/gates/workflow-steps.mjs
      - name: 步骤键形门自身的可假刀自检（K0/K4 绿、K1/K2/K3 红、K5 装置错）
        run: node tests/gates/workflow-steps.selftest.mjs
      - name: 行尾门（#1774 混行 ＋ #1832 整档翻转）
        #   ★`--require-base`：**取不到 base 即红**（✗ 静默退化成只判混行 ——
        #     门原先**声称**闭 4 例而**实际只闭 1 例**，正是这种「声称覆盖而大半没跑」的形态）。
        #   ★base **显式传 PR 的 base sha**：`GITHUB_BASE_SHA` **不是 Actions 变量**
        #     （官方表只有 `GITHUB_BASE_REF`＝**分支名**）⇒ 原先靠它解析是**死支**（`#1845` tester-4 指出）。
        #     `push`（main）下该表达式为空 ⇒ 自然落到门内的 `origin/main`。而 `fetch-depth: 0` 保证它存在。
        run: node tests/gates/line-endings.mjs --require-base --base "${{ github.event.pull_request.base.sha }}"

      - name: 行尾门自身的可假刀自检（#1775 D 席 5.1：判据改坏唯有自检能抓）
        run: node tests/gates/line-endings.mjs --selftest
      - name: core 宿主触点 lint（#1804 件二：棘轮 —— 新触点即红，摸清渗透面）
        run: node tests/gates/host-touchpoints.mjs
      - name: 宿主触点门自身的可假刀自检
        run: node tests/gates/host-touchpoints.mjs --selftest
      - name: 玩家可见文本门（#1863：上屏通路内不得出现票号／英文动作名／源码路径／系统话术）
        run: node tests/gates/player-text.mjs
      - name: 玩家文本门自身的可假刀自检（每条刀断到「红在哪一支」）
        run: node tests/gates/player-text.mjs --selftest
      - name: 构建（生成单测 bundle 与清单）
        run: python3 build.py
      # ★注册面门摆在**构建之后**（`#1807` 二轮 RC-B，本席实测更正）：它的**运行期交叉核对**
      #   要读 `tests/unit/dist/bundle.js`（由上行 build 产出）⇒ 摆在 build **之前**时
      #   该核对恒走「缺 bundle ⇒ 跳过」分支 ⇒ **运行期判据（floor／盲区内重复）永不生效**。
      #   （原先摆在 build 前是照抄其它门的位次，理由已陈旧 —— 本行即更正留痕。）
      - name: 注册面 fail-loud 门（#1804 件一：跨包同 id 须登记、同包重定义必红）
        run: node tests/gates/registration.mjs --require-bundle   # 位次须在 build 之后（NIT-6）
      - name: 注册面门自身的可假刀自检
        run: node tests/gates/registration.mjs --selftest
      - name: d20 消费点差集门（#1804：枚举 vs 实际集合 —— 新落点即点名）
        run: node tests/gates/d20-consumers.mjs
      - name: d20 门自身的可假刀自检
        run: node tests/gates/d20-consumers.mjs --selftest
      # ★宿主**打包**门（`#1998` 阶段 6 切片 B）：查的是**产物面** —— 缺省装默认宿主、`--host <id>` 只装所选
      #   并注入 `useHost`、`--host all` ⇒ 取用必吵（读面空袋）、未知 id 构建期具名抛。
      #   ⚠ 本步会**真调 `python3 build.py` 数次**（读真产物），收尾会重建缺省 ⇒ 是产物面的慢步之一。
      #   ⚠ 位次：本步**自带构建**（✗ 依赖上行 build 的产物），但它收尾会把 bundle 恢复成缺省态 ⇒ 摆在这里安全。
      - name: 宿主打包门（`#1998`：产物级宿主选择 ＋ 随仓第二宿主）
        run: node tests/gates/host-packaging.mjs
      - name: 宿主打包门自身的可假刀自检（K1–K9 纯函数刀 ＋ R1/R2/R3 真刀）
        run: node tests/gates/host-packaging.mjs --selftest
      # ── 规则包选择门（`sgstory#295` 甲 · 后续版本）：故事清单 `story.json` 的 `packs` 口 ⇒ build.py 按包过滤 ──
      #   判：无清单 ⇒ 全装（且 ≡ 显式全列，逐字节同）｜单包 ⇒ 只装它（core 恒入）｜未知／坏清单 ⇒ 构建期具名抛｜
      #      **与 `--host` 正交**（宿主按 --host 走、规则包按 packs 走）。
      #   ⚠ 同 host-packaging：本步**真调 build.py 数次**（在**临时故事副本**上），收尾重建缺省。
      - name: 规则包选择门（`#295`：故事清单 packs ＋ 按包过滤）
        run: node tests/gates/pack-selection.mjs
      - name: 规则包选择门自身的可假刀自检（R1 拆过滤／R2 未知静默 ＋ 复原逐字节同）
        run: node tests/gates/pack-selection.mjs --selftest
      # ── 注册面汇总门（`sgstory#295` 乙）：12 处散装「重复注册」warn ⇒ 加载期汇总**一条**（含计数与逐条具名）──
      #   读数是**真 bundle** 里捕获的 `console.warn`（探针子进程）；ⓑ 能力门：引擎有 `packs` 口时再断「单包 ⇒ 零冲突」。
      - name: 注册面汇总门（散装 warn ⇒ 汇总一条 · 计数同源）
        run: node tests/gates/regwarn-summary.mjs
      - name: 注册面汇总门自身的可假刀自检（R1 散装／R2 静默 ＋ 复原逐字节同）
        run: node tests/gates/regwarn-summary.mjs --selftest
      - name: 无头单测（断言 fail === 0）
        run: node tests/unit/headless.mjs
      # ★引擎单测**刀架**（`sgstory#1962`）：把「手工下刀 → 看红格 → 复原」自动化。
      #   它回答的是「这些判据**红得了**吗」——✗ 「判据过没过」（那是上一步的事）。
      #   ⚠ 靶分两层：构建产物 `tests/unit/dist/bundle.js` ＋ 框架档 `tests/unit/framework/harness.js`
      #     （后者**不在产物里** —— `#1958` 那次照产物层找锚，找不到）⇒ 摆位须在 build 之后。
      #   ⚠ 本壳会**子进程重跑单测**（3 把刀 ⇒ 约 4 次全量单测）⇒ 是本工作流最耗时的一步之一，
      #     故**不另开 job**（省一次 checkout）。刀表加刀前请先跑出实测红集（✗ 别凭想象填 expect）。
      #   ⚠ 退出码：0 全过／1 有红／2 环境错（缺产物即 rc=2，✗ 不静默当绿）。
      #   ★本步**不配守护 grep**：与 `books` 侧接线步不同 —— 那里守的是「输出形别静默退化」，
      #     而刀架**自己**就断「红集恰好等于期望」（多红少红皆红）⇒ 退出码已是真信号，✗ 输出形不是承重件。
      - name: 引擎单测刀架（`#1962`：三段式 刀 ⇒ 期望红格 ⇒ 复原自证）
        run: node tests/unit/headless.mjs --selftest
      # ★`#1877` P1-3/P1-6 的静态判据住在 `stories/babel/verify.mjs`（该件是**故事装配自检**：
      #   地图/层可达/单向门/跨包 API 接线/面板接线…）。**先前未接 CI** ⇒ 它在 CI 里**从不执行**，
      #   只在 books 交付树侧跑过 ⇒ 引擎侧改动一旦漂移，这些断言**静默失效**（tester-3 在 books#112 指出）。
      #   ⚠ 它只读 `tests/unit/dist/bundle.js`（上一步 build 产出）＋ 故事源档（**不依赖** `babel-trial.html`）
      #     ⇒ 摆位须在 build 之后、并与单测同 job（本门 <1s，另开 job 要多付一次 checkout）。
      #   ⚠ **不传** `--engine`：缺省即「引擎根＝两个上级」＝本仓现状（正是被测的那条路）。
      - name: 巴别装配自检（故事侧静态判据；须在 build 之后）
        run: node stories/babel/verify.mjs
      # ★`#1912` 交付 1（线 A·阶段 1 试点）：「行为保持」的**机械面**。
      #   基线锚在 main 的**现有行为**上（老宅木箱/酒架两格的进入副作用幂等 ＋ 存档往返后标记与背包一致），
      #   重构支（GameSession ＋ L0 宿主端口）rebase 于其上 ⇒ 行为一漂移本门即红。
      #   ⚠ 位次：它读 `tests/unit/dist/bundle.js`（上一步 build 产出）＋ 故事真源码 ⇒ 须在 build 之后。
      #   ⚠ 未判行**不静默跳过**：末行打印 `⏳` 与 pending 计数（「两会话独立」待 GameSession 落地）。
      - name: 老宅支线·行为基线（`#1912` 交付 1）
        run: node tests/e2e/old-house/run-baseline.mjs
      # ★门自身的可假刀自检：三条刀（撤 when 守卫／撤另一格守卫／把标记挪出存档面）
      #   各须红在**指定那一格**，且未下刀时须全绿 —— 否则「判据红不了」＝没有判据。
      - name: 老宅基线门自身的可假刀自检
        run: node tests/e2e/old-house/run-baseline.mjs --selftest
